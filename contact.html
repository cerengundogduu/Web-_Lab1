<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechSphere - Contact</title>
</head>
<body>

    <header>
        <h1>TechSphere Digital Studio</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Project Inquiry Form</legend>

                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" required>
                </p>

                <p>
                    <label for="user-email">Email Address:</label><br>
                    <input type="email" id="user-email" name="email" required>
                </p>

                <p>
                    <label for="project-date">Target Launch Date:</label><br>
                    <input type="date" id="project-date" name="project_date">
                </p>

                <p>
                    <label for="service-tier">Select Service:</label><br>
                    <select id="service-tier" name="service">
                        <option value="static">Static Landing Page</option>
                        <option value="multipage">Multi-Page Architecture</option>
                        <option value="portfolio">Portfolio Skeleton</option>
                    </select>
                </p>

                <p>
                    <label for="message">Project Description:</label><br>
                    <textarea id="message" name="message" rows="5" cols="30" placeholder="Provide project specifications..."></textarea>
                </p>

                <p>
                    <input type="submit" value="Submit Inquiry">
                </p>
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 TechSphere. All Rights Reserved. Created by: [Your Name]</p>
    </footer>

</body>
</html>
